# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# 글쓰기 화면(/admin/) 설정. 필드는 src/content.config.ts 의 스키마와 맞춘다.
backend:
  name: github
  repo: jcmaker/blog

# 글에 속하지 않는 공용 이미지 위치
media_folder: public/images
public_folder: /images

output:
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: 글
    label_singular: 글
    folder: src/content/blog
    # 글마다 폴더 하나: src/content/blog/<주소>/index.md, 이미지는 같은 폴더에 저장
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    extension: md
    media_folder: ''
    public_folder: ''
    create: true
    fields:
      - { name: title, label: 제목, widget: string }
      - name: slug
        label: 주소
        hint: '영문 소문자·숫자·하이픈. blog.justincho.dev/blog/<주소>/ 가 된다.'
        widget: string
        pattern: ['^[a-z0-9-]+$', '영문 소문자, 숫자, 하이픈만 쓸 수 있어요']
      - { name: description, label: 요약, widget: string }
      - { name: pubDate, label: 발행일, widget: datetime, type: date }
      - name: category
        label: 카테고리
        hint: '영문 소문자 (예: tech, life). 새 값을 쓰면 카테고리 페이지가 생긴다.'
        widget: string
        default: tech
        pattern: ['^[a-z0-9-]+$', '영문 소문자, 숫자, 하이픈만 쓸 수 있어요']
      - { name: tags, label: 태그, widget: list, required: false }
      - { name: draft, label: 초안 (켜면 블로그에 안 보임), widget: boolean, default: false }
      - { name: heroImage, label: 대표 이미지, widget: image, required: false }
      - { name: body, label: 본문, widget: markdown }
